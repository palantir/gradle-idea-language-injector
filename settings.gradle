buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.62.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'gradle-idea-language-injector'

include 'idea-language-injector'
